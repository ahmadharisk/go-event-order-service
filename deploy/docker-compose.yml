services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  redpanda:
    image: redpandadata/redpanda:v24.1.8
    command: ["redpanda","start","--smp 1","--overprovisioned","--kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092","--advertise-kafka-addr internal://redpanda:9092,external://localhost:19092"]
    ports: ["19092:19092","9644:9644"]
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
volumes: { pgdata: {}}
